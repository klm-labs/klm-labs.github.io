<main id="main" class="container document-page">
  <nav class="breadcrumb" aria-label="Breadcrumb"><a href="/">Our apps</a><span aria-hidden="true">/</span><a href="/$slug/">$name</a><span aria-hidden="true">/</span><span>$page_label</span></nav>
  <div class="document-grid">
    <aside class="document-sidebar" aria-label="App resources"><a class="document-app" href="/$slug/"><img src="$icon" alt="" width="48" height="48"><span>$name<small>by $developer</small></span></a><nav aria-label="App resources">$document_links</nav><a class="text-link back-to-app" href="/$slug/">$arrow_left Back to the app</a></aside>
    <article class="document-content"><header class="document-header"><p class="eyebrow">$name</p><h1>$page_label</h1><p class="document-deck">$deck</p></header><div class="prose">$body</div></article>
  </div>
</main>
